<svg width="1000" height="240" viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F75C7E"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F75C7E" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.18"/>
    </linearGradient>
    <style>
      .bar { transform-origin: center; transform-box: fill-box; animation: eq 1.4s ease-in-out infinite; }
      @keyframes eq {
        0%, 100% { transform: scaleY(0.3); }
        50% { transform: scaleY(1); }
      }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
    </style>
  </defs>

  <!-- background -->
  <rect x="1" y="1" width="998" height="238" rx="20" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="998" height="238" rx="20" fill="url(#bgGlow)"/>

  <!-- top hairline accent -->
  <rect x="40" y="34" width="56" height="4" rx="2" fill="url(#accent)"/>

  <!-- name + title -->
  <text x="40" y="102" font-size="52" font-weight="800" fill="#e6edf3" letter-spacing="1">ROHAN SALVI</text>
  <text x="40" y="140" font-size="19" font-weight="600" fill="url(#accent)" letter-spacing="6">CONVERSATIONAL AI ARCHITECT</text>

  <!-- terminal-style tagline -->
  <text x="40" y="186" font-size="15" fill="#8b949e" font-family="SF Mono, Consolas, monospace">&gt; designing agents that listen, think &amp; talk back</text>
  <rect class="cursor" x="475" y="173" width="8" height="16" fill="#F75C7E"/>

  <!-- voice waveform equalizer -->
  <g>
    <rect class="bar" x="700" y="70" width="10" height="100" rx="5" fill="url(#accent)" style="animation-delay:0s"/>
    <rect class="bar" x="722" y="55" width="10" height="130" rx="5" fill="url(#accent)" style="animation-delay:.15s"/>
    <rect class="bar" x="744" y="80" width="10" height="80" rx="5" fill="url(#accent)" style="animation-delay:.3s"/>
    <rect class="bar" x="766" y="45" width="10" height="150" rx="5" fill="url(#accent)" style="animation-delay:.45s"/>
    <rect class="bar" x="788" y="70" width="10" height="100" rx="5" fill="url(#accent)" style="animation-delay:.6s"/>
    <rect class="bar" x="810" y="90" width="10" height="60" rx="5" fill="url(#accent)" style="animation-delay:.75s"/>
    <rect class="bar" x="832" y="60" width="10" height="120" rx="5" fill="url(#accent)" style="animation-delay:.9s"/>
    <rect class="bar" x="854" y="82" width="10" height="76" rx="5" fill="url(#accent)" style="animation-delay:1.05s"/>
    <rect class="bar" x="876" y="65" width="10" height="110" rx="5" fill="url(#accent)" style="animation-delay:1.2s"/>
    <rect class="bar" x="898" y="88" width="10" height="64" rx="5" fill="url(#accent)" style="animation-delay:1.35s"/>
    <rect class="bar" x="920" y="72" width="10" height="96" rx="5" fill="url(#accent)" style="animation-delay:1.5s"/>
  </g>

  <!-- status chip -->
  <g>
    <rect x="700" y="196" width="230" height="26" rx="13" fill="#161b22" stroke="#30363d"/>
    <circle class="pulse" cx="716" cy="209" r="4" fill="#3fb950"/>
    <text x="728" y="214" font-size="12" fill="#8b949e" font-family="SF Mono, Consolas, monospace">listening on all channels…</text>
  </g>
</svg>
